name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sdr
          POSTGRES_DB: sdr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:sdr@localhost:5432/sdr
      TEST_DATABASE_URL: postgresql://postgres:sdr@localhost:5432/sdr_test
      PROVIDER_MODE: fake
      JOB_MODE: inline
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # Ephemeral gate credentials for this run only; generated so no secret-like literal lives in the repo.
      - name: Generate throwaway app credentials
        run: |
          echo "APP_PASSPHRASE=ci-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "APP_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: psql "$DATABASE_URL" -c "CREATE DATABASE sdr_test;"
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: printf 'DATABASE_URL=%s\nTEST_DATABASE_URL=%s\n' "$DATABASE_URL" "$TEST_DATABASE_URL" > .env
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
