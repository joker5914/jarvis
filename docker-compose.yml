services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sdr
      POSTGRES_DB: sdr
    ports:
      - "5432:5432"
    volumes:
      - sdr_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
volumes:
  sdr_pgdata:
